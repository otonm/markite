[package]
name = "markite-kde"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "markite"
path = "src/main.rs"

[features]
# Debug tracing to stderr: forwards core's `trace` feature and enables the C++ shim's traces (build.rs).
trace = ["markite-core/trace"]

[dependencies]
markite-core = { path = "../core" }
cxx = "1"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_full"] }
cxx-qt-lib-extras = "0.8"

[build-dependencies]
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
