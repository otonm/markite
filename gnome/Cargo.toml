[package]
name = "markite-gnome"
version = "1.1.0"   # set with docker/set_version.sh
edition = "2021"
license = "MIT"
description = "Markite, GTK 4 / libadwaita frontend"

# Its own workspace: the KDE frontend and this one never share a lockfile or a target directory.
[workspace]

[dependencies]
markite-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
sourceview = { package = "sourceview5", version = "0.11" }
webkit = { package = "webkit6", version = "0.6" }
serde_json = "1"

[features]
# Debug tracing to stderr (forwards to the core's trace feature).
trace = ["markite-core/trace"]
