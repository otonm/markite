[package]
name = "markite-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "markite_core"

[features]
# Debug tracing to stderr (see src/trace.rs). Off in release builds: the trace! calls compile to nothing.
trace = []

[dependencies]
# Pure-Rust encoding conversion and statistical detection (no C library, so the static musl build still works).
encoding_rs = "0.8"
chardetng = "0.1"
# No default features: they pull in the comrak CLI (clap, ...) and the onig C regex engine, which syntect would prefer
# over the pure-Rust one below. Only the Markdown parser/renderer and its adapter traits are used.
comrak = { version = "0.54", default-features = false }
# Pure-Rust regex engine (fancy-regex), so the static musl build needs no C library.
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
